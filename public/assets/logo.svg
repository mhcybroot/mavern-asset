<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="mavernGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="mavernAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <rect width="100" height="100" rx="22" fill="#0f172a"/>
    <!-- Stylized 'M' intertwined with growing green leaves / Texas tree -->
    <path d="M26 76 L26 34 L50 56 L74 34 L74 76" fill="none" stroke="url(#mavernAmber)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Organic Leaf Canopy Accent -->
    <path d="M50 24 C40 32 40 44 50 54 C60 44 60 32 50 24 Z" fill="url(#mavernGreen)"/>
    <circle cx="50" cy="38" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Company Name Typography -->
  <g transform="translate(130, 26)">
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="0.04em">
      MAVERN
    </text>
    <text x="160" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#15803d" letter-spacing="0.02em">
      LANDSCAPING
    </text>
    <text x="2" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#d97706" letter-spacing="0.22em">
      ASSET MANAGEMENT LLC • ARLINGTON, TX
    </text>
  </g>
</svg>
